services:
  postgres:
    image: postgres:16-alpine
    container_name: empulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: empulse
    ports:
      - "5432:5432"
    volumes:
      - empulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  empulse_pgdata:
